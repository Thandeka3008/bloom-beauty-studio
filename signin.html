<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Bloom Beauty Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame">
    <main class="stage">
     <h1 class="logo logo-sm"><img src="images/logo.jpeg" alt="Bloom Beauty Studio"></h1>

      <section class="card">
        <div class="tabs" role="tablist">
          <button type="button" id="tab-in" class="tab active" role="tab" aria-selected="true">Sign in</button>
          <button type="button" id="tab-up" class="tab" role="tab" aria-selected="false">Sign up</button>
        </div>

        <div id="message" class="msg" role="alert" hidden></div>

        <form id="form-in" novalidate>
          <label for="in-email">Email</label>
          <input id="in-email" type="email" autocomplete="username" inputmode="email" required>

          <label for="in-password">Password</label>
          <div class="pw-wrap">
            <input id="in-password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="in-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <button type="submit" class="btn btn-block">Sign in</button>
        </form>

        <form id="form-up" novalidate hidden>
          <label for="up-name">Full name</label>
          <input id="up-name" type="text" autocomplete="name" maxlength="80" required>

          <label for="up-email">Email</label>
          <input id="up-email" type="email" autocomplete="username" inputmode="email" required>

          <label for="up-password">Password</label>
          <div class="pw-wrap">
            <input id="up-password" type="password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="up-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <small class="muted">At least 8 characters.</small>

          <label for="up-confirm">Confirm password</label>
          <div class="pw-wrap">
            <input id="up-confirm" type="password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="up-confirm" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <button type="submit" class="btn btn-block">Create account</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
