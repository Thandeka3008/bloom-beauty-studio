<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings - Bloom Beauty Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame frame-top">
    <main class="stage stage-wide">
      <header class="bar">
        <span class="bar-brand">Bloom Beauty Studio</span>
        <button type="button" id="signout" class="link">Sign out</button>
      </header>

      <p id="loading" class="muted">Loading...</p>

      <div id="page" hidden>
        <section class="card">
          <h1>Book an appointment</h1>
          <p class="muted">Welcome, <span id="welcome"></span>. Pick a service and a time, pay your deposit, and Bloom will confirm your booking.</p>

          <div id="book-msg" class="msg" role="alert" hidden></div>

          <form id="book-form" novalidate>
            <label for="service">Service</label>
            <select id="service" required></select>

            <label for="date">Date</label>
            <input id="date" type="date" required>

            <label>Time</label>
            <div id="slots" class="slots" aria-live="polite">
              <p class="muted">Choose a service and a date to see the times.</p>
            </div>

            <div id="deposit-step" class="deposit-step" hidden>
              <label>How much deposit are you paying?</label>
              <p id="deposit-hint" class="muted"></p>
              <div id="amounts" class="slots"></div>

              <p class="bank-title">Pay by EFT to:</p>
              <p id="bank" class="bank"></p>

              <label for="pop">Proof of payment (photo or PDF)</label>
              <input id="pop" type="file" accept="image/*,application/pdf">
            </div>

            <label for="phone">Phone / WhatsApp number</label>
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 082 123 4567">

            <label for="notes">Design notes (optional)</label>
            <textarea id="notes" rows="3" maxlength="500" placeholder="Colour, shape, any design ideas"></textarea>

            <label for="photo">Reference photo (optional)</label>
            <input id="photo" type="file" accept="image/*">

            <p id="summary" class="summary" hidden></p>

            <button type="submit" class="btn btn-block">Request booking</button>
          </form>
        </section>

        <section class="card">
          <h2>My bookings</h2>
          <div id="my-bookings"><p class="muted">Loading...</p></div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/client.js"></script>
  <script>initRolePage("client").then((profile) => { if (profile) startClient(profile); });</script>
</body>
</html>
